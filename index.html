<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Bosquejo"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Mi Bosquejo Bíblico</title><style>
:root{--g:#173c32;--gold:#c69b48}*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#252820;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:var(--g);color:white;padding:25px 20px;border-radius:0 0 22px 22px}header small{color:#e6d5ae;text-transform:uppercase;letter-spacing:.1em}h1{font: bold 27px Georgia;margin:8px 0}header p{margin:0;color:#e5ece8}main{max-width:700px;margin:auto;padding:16px}.step{background:white;border:1px solid #e9e5db;border-radius:14px;padding:16px;margin:12px 0}.head{display:flex;gap:10px;align-items:center}.num{background:#f2ead9;color:#76551e;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:bold}h2{font-size:16px;margin:0}.hint{font-size:13px;color:#72766e;margin:7px 0}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #dcded7;border-radius:9px;font:16px -apple-system,sans-serif}textarea{min-height:85px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{border:0;border-radius:10px;padding:12px 14px;background:var(--g);color:white;font-weight:bold}button.alt{background:#eeeae0;color:#333}#status{font-size:12px;color:#28664b}.bar{height:5px;background:#e7e4db;border-radius:5px}.bar span{display:block;height:5px;background:var(--gold);width:0}footer{text-align:center;color:#72766e;font-size:12px;margin:20px}
</style></head><body><header><small>Guía de estudio y predicación</small><h1>Mi Bosquejo Bíblico</h1><p>Ordena tus ideas y desarrolla el mensaje paso a paso.</p></header><main><div class="bar"><span id="progress"></span></div><p id="status">Tus cambios se guardan automáticamente en este dispositivo.</p>
<div id="fields"></div><div class="actions"><button id="download">Descargar bosquejo</button><button class="alt" onclick="window.print()">Imprimir / Guardar PDF</button><button class="alt" id="clear">Borrar y comenzar</button></div><footer>Deja que el texto bíblico dirija cada punto del mensaje.</footer></main>
<script>
const steps=[["Tema del mensaje","¿De qué vas a hablar? Escribe una frase corta.",["Título o tema","Ej.: Renovando nuestra mente"]],["Texto bíblico principal","¿Qué pasaje sostiene tu enseñanza?",["Pasaje principal","Ej.: Romanos 12:1–2"],["Contexto del pasaje","¿Quién lo escribió? ¿A quién? ¿Qué estaba ocurriendo?"]],["Propósito","¿Qué quieres que la persona comprenda, crea o practique?",["Idea central","Al terminar este mensaje, quiero que…"]],["Introducción","Despierta el interés y conecta el tema con la vida.",["¿Cómo comenzarás?","Una pregunta, historia o necesidad…"]],["Desarrollo del mensaje","Explica el texto paso a paso. Incluye explicación, apoyo bíblico y aplicación.",["Punto 1","Explicación + versículo de apoyo + aplicación…"],["Punto 2","Explicación + versículo de apoyo + aplicación…"],["Punto 3","Explicación + versículo de apoyo + aplicación…"]],["Ilustración o ejemplo","Una historia o comparación que ayude a recordar.",["Ejemplo","¿Qué ejemplo aclara el mensaje?"]],["Conclusión y llamado","Resume la verdad e invita a responder.",["Conclusión","¿Qué verdad deben recordar?"],["Llamado o aplicación final","¿Qué paso concreto pueden dar?"]],["Oración final","Escribe motivos de oración relacionados con el mensaje.",["Motivos / oración","Señor, ayúdanos a…"]]];
const root=document.getElementById('fields'), all=[];
steps.forEach((s,i)=>{let box=document.createElement('section');box.className='step';box.innerHTML='<div class="head"><span class="num">'+(i+1)+'</span><h2>'+s[0]+'</h2></div><p class="hint">'+s[1]+'</p>';s.slice(2).forEach((f,j)=>{let id='f'+i+'_'+j,lab=document.createElement('label'),el=document.createElement(f[0].includes('Punto')||f[0].includes('Contexto')||f[0].includes('Conclusión')||f[0].includes('Llamado')||f[0].includes('Ejemplo')||f[0].includes('oración')||f[0].includes('Oración')||f[0].includes('¿Cómo')||f[0].includes('Idea central')?'textarea':'input');lab.textContent=f[0];el.placeholder=f[1];el.id=id;el.value=localStorage.getItem(id)||'';el.addEventListener('input',()=>{localStorage.setItem(id,el.value);status.textContent='Guardado automáticamente';update()});box.append(lab,el);all.push({id,label:f[0],el})});root.append(box)});
const status=document.getElementById('status');function update(){let n=all.filter(x=>x.el.value.trim()).length;document.getElementById('progress').style.width=(n/all.length*100)+'%'}update();
document.getElementById('download').onclick=()=>{let t='MI BOSQUEJO BÍBLICO\n\n'+all.map(x=>x.label+'\n'+(x.el.value||'—')).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='mi-bosquejo-biblico.txt';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('clear').onclick=()=>{if(confirm('¿Borrar todos los campos?')){all.forEach(x=>{x.el.value='';localStorage.removeItem(x.id)});update();status.textContent='Bosquejo borrado.'}};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
